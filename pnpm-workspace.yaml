packages:
  - 'packages/*'
# proxy-addr@2.0.7 (puxado pelo express) tem uma CVE de spoofing de IP em trust proxy
# por sub-rede/CIDR — não é o nosso caso (TRUST_PROXY usa contagem de saltos, ver
# api/src/app.ts), mas o patch é trivial e sem risco, então fixamos a versão corrigida.
overrides:
  proxy-addr: ^2.0.8
  # Dependências transitivas do axios (web) e do express 4.x (api) com patch
  # disponível mas não puxado pelas versões declaradas. "body-parser@1" escopado
  # pra não forçar quem pede body-parser 2.x (dependência de dev só, não roda
  # em produção) para trás.
  follow-redirects: ^1.16.2
  body-parser@1: ^1.20.9
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
